services:
  - type: web
    name: autocover
    runtime: node
    buildCommand: npm ci --include=dev && npm ci --prefix frontend --include=dev && npm run build --prefix frontend && npm run typecheck
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: autocover
      - key: AUTOCOVER_REFERENCE_DATE
        value: 2026-11-10
      - key: MOCK_PROVIDER_D_FAILURE_RATE
        value: 0.12
